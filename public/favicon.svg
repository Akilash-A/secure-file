<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="url(#gradient)"/>
  
  <!-- Lock icon -->
  <g fill="white">
    <!-- Lock body -->
    <rect x="11" y="16" width="10" height="8" rx="1" fill="white"/>
    
    <!-- Lock shackle -->
    <path d="M13 16v-3c0-1.7 1.3-3 3-3s3 1.3 3 3v3" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- Keyhole -->
    <circle cx="16" cy="19" r="1" fill="url(#gradient)"/>
    <rect x="15.5" y="19" width="1" height="2" fill="url(#gradient)"/>
  </g>
</svg>
